<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="styles.css" />
        <title>Music Player</title>
    </head>

    <body>
        <div class="background">
            <img src="" id="bg-img" />
        </div>

        <div class="container">
            <div class="player-img">
                <img src="" class="active" id="cover" />
            </div>

            <h2 id="music-title"></h2>
            <h3 id="music-artist"></h3>

            <!-- Lista de selección de canciones -->
            <div class="song-list" id="song-list"></div>

            <!-- Subir archivo mp3 -->
            <div class="upload-container">
                <input
                    type="file"
                    id="upload-mp3"
                    accept="audio/*"
                    style="display: none"
                />
                <input
                    type="file"
                    id="upload-img"
                    accept="image/*"
                    style="display: none"
                />
                <button id="upload-btn">Subir canción (.mp3) y portada</button>
                <div
                    id="preview-img-container"
                    style="display: none; margin-top: 10px; text-align: center"
                >
                    <span style="color: #fff">Vista previa de portada:</span
                    ><br />
                    <img
                        id="preview-img"
                        src=""
                        style="
                            max-width: 120px;
                            max-height: 120px;
                            border-radius: 10px;
                            margin-top: 5px;
                        "
                    />
                </div>
            </div>

            <div class="player-progress" id="player-progress">
                <div class="progress" id="progress"></div>
                <div class="music-duration">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <i class="fa-solid fa-backward" title="Previous" id="prev"></i>
                <i
                    class="fa-solid fa-play play-button"
                    title="Play"
                    id="play"
                ></i>
                <i class="fa-solid fa-forward" title="Next" id="next"></i>
            </div>

            <!-- Barra de Volumen -->
            <div class="volume-container">
                <i class="fa-solid fa-volume-low"></i>
                <input
                    type="range"
                    id="volume-slider"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                />
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
