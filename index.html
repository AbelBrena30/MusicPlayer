<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reproductor de Música</title>
        <link rel="stylesheet" href="styles.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
    </head>
    <body>
        <div class="background">
            <img src="assets/1.jpg" id="bg-img" alt="Fondo borroso" />
        </div>
        <div class="container" id="main-container">
            <div class="player-img" style="position: relative">
                <img
                    src="assets/1.jpg"
                    class="active"
                    id="cover"
                    alt="Portada"
                />
                <button
                    id="edit-cover-btn"
                    class="edit-cover-btn"
                    title="Editar portada"
                >
                    <i class="fa-solid fa-pencil"></i>
                </button>
            </div>
            <h2 id="music-title">Una Mañana</h2>
            <h3 id="music-artist">José José</h3>
            <div class="player-progress" id="player-progress">
                <span id="current-time">00:00</span>
                <div class="progress-bar-bg">
                    <div class="progress-bar" id="progress"></div>
                </div>
                <span id="duration">00:00</span>
            </div>
            <div class="player-controls">
                <i
                    class="fa-solid fa-random"
                    title="Aleatorio"
                    id="shuffle"
                ></i>
                <i class="fa-solid fa-backward" title="Anterior" id="prev"></i>
                <i
                    class="fa-solid fa-play play-button"
                    title="Play"
                    id="play"
                ></i>
                <i class="fa-solid fa-forward" title="Siguiente" id="next"></i>
                <i class="fa-solid fa-repeat" title="Repetir" id="repeat"></i>
            </div>
            <div id="volume-percent"></div>
            <div class="volume-container">
                <i class="fa-solid fa-volume-low"></i>
                <input
                    type="range"
                    id="volume-slider"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                />
                <i class="fa-solid fa-volume-high"></i>
            </div>
        </div>
        <button id="song-popup-btn" class="song-popup-btn">
            Una Mañana - José José
        </button>
        <div class="song-list" id="song-list">
            <input
                type="file"
                id="upload-mp3"
                accept="audio/*"
                style="display: none"
            />
            <button id="upload-btn" class="circle-upload-btn">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        <div class="player-popup" id="player-popup">
            <div class="popup-content">
                <span class="close-popup" id="close-popup">&times;</span>
                <h2>Lista de canciones</h2>
                <ul id="popup-song-list"></ul>
                <button id="popup-upload-btn" class="popup-upload-btn">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
